name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPO }}
  IMAGE_TAG: latest
  CONTAINER_NAME: realtime-source-code-analyser

jobs:
  ci:
    name: Validate and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check Python syntax
        run: python -m compileall app.py store_index.py src

      - name: Build Docker image
        run: docker build -t $CONTAINER_NAME:test .

  push-image:
    name: Push Image to Amazon ECR
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          SHA_IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"

          docker build -t "$IMAGE_URI" -t "$SHA_IMAGE_URI" .
          docker push "$IMAGE_URI"
          docker push "$SHA_IMAGE_URI"

  deploy:
    name: Deploy to EC2
    needs: push-image
    runs-on: self-hosted
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull and restart container
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker pull "$IMAGE_URI"
          docker stop "$CONTAINER_NAME" || true
          docker rm "$CONTAINER_NAME" || true

          docker run -d \
            --name "$CONTAINER_NAME" \
            --restart unless-stopped \
            -e OPENAI_API_KEY="$OPENAI_API_KEY" \
            -p 8080:8080 \
            "$IMAGE_URI"