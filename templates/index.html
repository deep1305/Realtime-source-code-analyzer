<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Realtime Source Code Analyser</title>

    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
      integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7t27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
      crossorigin="anonymous"
    >
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
      integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU"
      crossorigin="anonymous"
    >
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
      .repo_panel {
        max-width: 760px;
        margin: 24px auto 18px;
        padding: 18px;
        border-radius: 15px;
        background-color: rgba(0, 0, 0, 0.4);
      }

      .repo_panel label,
      .repo_panel small {
        color: rgba(255, 255, 255, 0.85);
      }

      .repo_status {
        min-height: 24px;
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.75);
      }

      .repo_status.success {
        color: #58cc71;
      }

      .repo_status.error {
        color: #ff7675;
      }

      .msg_cotainer,
      .msg_cotainer_send {
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>

  <body>
    <div class="container-fluid h-100">
      <div class="repo_panel">
        <form id="repo-form">
          <label for="repo-url">GitHub Repository URL</label>
          <div class="input-group">
            <input
              type="url"
              id="repo-url"
              name="question"
              class="form-control search"
              placeholder="https://github.com/username/repository"
              required
            >
            <div class="input-group-append">
              <button type="submit" id="repo-submit" class="input-group-text search_btn">
                Index Repo
              </button>
            </div>
          </div>
          <div id="repo-status" class="repo_status">
            Index a repository first, then ask questions in the chat below.
          </div>
        </form>
      </div>

      <div class="row justify-content-center h-100">
        <div class="col-md-8 col-xl-6 chat">
          <div class="card">
            <div class="card-header msg_head">
              <div class="d-flex bd-highlight">
                <div class="img_cont">
                  <img
                    src="https://p7.hiclipart.com/preview/1010/961/279/computer-icons-source-code-html-coding.jpg"
                    class="rounded-circle user_img"
                    alt="Source code icon"
                  >
                  <span class="online_icon"></span>
                </div>
                <div class="user_info">
                  <span>Source Code Analysis</span>
                  <p>Ask anything about the indexed repository.</p>
                </div>
              </div>
            </div>

            <div id="messageFormeight" class="card-body msg_card_body">
              <div class="d-flex justify-content-start mb-4">
                <div class="img_cont_msg">
                  <img
                    src="https://p7.hiclipart.com/preview/1010/961/279/computer-icons-source-code-html-coding.jpg"
                    class="rounded-circle user_img_msg"
                    alt="Bot"
                  >
                </div>
                <div class="msg_cotainer">Submit a GitHub repository URL first. After indexing completes, ask questions like "What does app.py do?"</div>
              </div>
            </div>

            <div class="card-footer">
              <form id="messageArea" class="input-group">
                <input
                  type="text"
                  id="text"
                  name="msg"
                  placeholder="Type your message..."
                  autocomplete="off"
                  class="form-control type_msg"
                  required
                >
                <div class="input-group-append">
                  <button type="submit" id="send" class="input-group-text send_btn">
                    <i class="fas fa-location-arrow"></i>
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="{{ url_for('static', filename='jquery.min.js') }}"></script>
    <script
      src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js"
      integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy"
      crossorigin="anonymous"
    ></script>
    <script>
      function getCurrentTime() {
        var date = new Date();
        var hour = date.getHours();
        var minute = date.getMinutes();
        return hour + ":" + (minute < 10 ? "0" + minute : minute);
      }

      function appendUserMessage(text) {
        var userHtml = $("<div></div>").addClass("d-flex justify-content-end mb-4");
        var message = $("<div></div>").addClass("msg_cotainer_send").text(text);
        var time = $("<span></span>").addClass("msg_time_send").text(getCurrentTime());
        var imageWrap = $("<div></div>").addClass("img_cont_msg");
        var image = $("<img>")
          .addClass("rounded-circle user_img_msg")
          .attr("src", "https://i.ibb.co/d5b84Xw/Untitled-design.png")
          .attr("alt", "User");

        message.append(time);
        imageWrap.append(image);
        userHtml.append(message).append(imageWrap);
        $("#messageFormeight").append(userHtml);
        scrollChatToBottom();
      }

      function appendBotMessage(text) {
        var botHtml = $("<div></div>").addClass("d-flex justify-content-start mb-4");
        var imageWrap = $("<div></div>").addClass("img_cont_msg");
        var image = $("<img>")
          .addClass("rounded-circle user_img_msg")
          .attr("src", "https://p7.hiclipart.com/preview/1010/961/279/computer-icons-source-code-html-coding.jpg")
          .attr("alt", "Bot");
        var message = $("<div></div>").addClass("msg_cotainer").text(text);
        var time = $("<span></span>").addClass("msg_time").text(getCurrentTime());

        imageWrap.append(image);
        message.append(time);
        botHtml.append(imageWrap).append(message);
        $("#messageFormeight").append(botHtml);
        scrollChatToBottom();
      }

      function scrollChatToBottom() {
        var chatBody = $("#messageFormeight");
        chatBody.scrollTop(chatBody[0].scrollHeight);
      }

      function setRepoLoading(isLoading) {
        $("#repo-submit").prop("disabled", isLoading).text(isLoading ? "Indexing..." : "Index Repo");
        $("#repo-url").prop("disabled", isLoading);
      }

      function setChatLoading(isLoading) {
        $("#send").prop("disabled", isLoading);
        $("#text").prop("disabled", isLoading);
      }

      $("#repo-form").on("submit", function(event) {
        event.preventDefault();

        var repoUrl = $("#repo-url").val().trim();
        if (!repoUrl) {
          return;
        }

        setRepoLoading(true);
        $("#repo-status")
          .removeClass("success error")
          .text("Indexing repository. This can take a few minutes...");

        $.ajax({
          type: "POST",
          url: "/chatbot",
          data: { question: repoUrl },
          success: function(result) {
            $("#repo-status")
              .removeClass("error")
              .addClass("success")
              .text(result.response || "Repository indexed successfully.");
            appendBotMessage("Repository indexed. You can ask questions now.");
          },
          error: function(xhr) {
            var errorText = "Failed to index repository.";
            if (xhr.responseJSON && xhr.responseJSON.error) {
              errorText = xhr.responseJSON.error;
            } else if (xhr.responseText) {
              errorText = xhr.responseText;
            }

            $("#repo-status")
              .removeClass("success")
              .addClass("error")
              .text(errorText);
          },
          complete: function() {
            setRepoLoading(false);
          }
        });
      });

      $("#messageArea").on("submit", function(event) {
        event.preventDefault();

        var rawText = $("#text").val().trim();
        if (!rawText) {
          return;
        }

        appendUserMessage(rawText);
        $("#text").val("");
        setChatLoading(true);

        $.ajax({
          data: { msg: rawText },
          type: "POST",
          url: "/get",
          success: function(data) {
            appendBotMessage(data);
          },
          error: function(xhr) {
            appendBotMessage(xhr.responseText || "Something went wrong.");
          },
          complete: function() {
            setChatLoading(false);
            $("#text").focus();
          }
        });
      });
    </script>
  </body>
</html>
